# Elf Recursion - an 80s green-screen computer that has been left running too
# long, and the gold-clawed thing breaking out of it. Void-violet glass, acid
# phosphor green for anything that demands attention, machine-elf gold, with
# ultraviolet and hot magenta bleeding at the edges. Dark mode only.
mode = "dark"

# Signature colour: acid phosphor green, straight off a CRT.
accent = "#00ffa3"
selection = "#123b36"
muted = "#1b3038"

background = "#07050e"
dark_background = "#04030a"
darker_background = "#020106"
lighter_background = "#0d0a18"

foreground = "#b6f7dc"
dark_foreground = "#3f6b60"
light_foreground = "#a5e8cd"
bright_foreground = "#e6fff5"

# ANSI: greens are the phosphor, the rest are the hyperspace spectrum.
red = "#ff3860"
orange = "#ff8a3d"
yellow = "#ffb43d"
green = "#00e08a"
cyan = "#2ee6ff"
blue = "#7a5cff"
magenta = "#d94dff"
brown = "#8a5a12"

bright_red = "#ff6b8a"
bright_yellow = "#ffdc8a"
bright_green = "#4dffb8"
bright_cyan = "#8ef7ff"
bright_blue = "#a98cff"
bright_magenta = "#ff6be8"

# Phosphor green through elf gold into ultraviolet.
hyprland_active_border = "rgba(00ffa3ee) rgba(ffb43dee) rgba(7a5cffee) 45deg"
hyprland_inactive_border = "rgba(1f4a42cc)"
