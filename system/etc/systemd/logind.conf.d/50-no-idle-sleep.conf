# Never suspend because the machine was idle; idle means "lock the screen and
# turn the panels off" here (omarchy: screensaver 2 min, lock 20 min, panels off
# 10 min after the lock). Suspending stays available on purpose: menu, lid on a
# laptop, `systemctl suspend`.
[Login]
IdleAction=ignore

# Laptop behaviour: closing the lid suspends, a docked lid does not.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
